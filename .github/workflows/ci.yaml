name: K8s Load Test CI

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  load-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          pip install requests

      - name: Install kubectl
        run: |
          curl -LO "https://dl.k8s.io/release/v1.28.0/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          kubectl version --client

      - name: Install KinD
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.20.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind
          kind version

      - name: Create KinD cluster
        run: |
          kind create cluster --config k8s/kind-config.yaml --wait 5m
          kubectl cluster-info
          kubectl get nodes

      - name: Install Istio
        run: |
          chmod +x scripts/deploy-istio.sh
          ./scripts/deploy-istio.sh

      - name: Deploy applications
        run: |
          chmod +x scripts/deploy-apps.sh
          ./scripts/deploy-apps.sh

      - name: Run health checks
        run: |
          chmod +x scripts/health-check.sh
          ./scripts/health-check.sh

      - name: Run load tests
        id: load_test
        run: |
          chmod +x scripts/load-test.py
          python3 scripts/load-test.py

      - name: Format results for comment
        if: always()
        run: |
          chmod +x scripts/format-results.sh
          ./scripts/format-results.sh

      - name: Upload results as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: |
            loadtest-results.json
            loadtest-results.md
            github-comment.md

      - name: Post results to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            
            // Read the formatted comment
            let comment = '';
            try {
              comment = fs.readFileSync('github-comment.md', 'utf8');
            } catch (error) {
              comment = '❌ Failed to read load test results';
            }
            
            // Post comment on the PR
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment
            });

      - name: Cleanup
        if: always()
        run: |
          kind delete cluster --name devops-test || true
